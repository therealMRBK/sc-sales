<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star Citizen Store-Sales</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000b18'/%3E%3Cpath d='M16 4 L26 16 L16 28 L6 16 Z' fill='%2343edf8'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Electrolize&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  /* Farb-/Schrift-Palette 1:1 aus RSIs eigenem CSS extrahiert
     (robertsspaceindustries.com/cache/en/rsi-css.css) -- Google-Fonts-Familien
     Orbitron/Electrolize/Share+Tech+Mono lädt RSI selbst über dieselbe
     /rsi/assets/fonts.css-Route. */
  :root {
    --bg: #000b18;
    --bg-deep: #000;
    --panel: #051220;
    --panel-2: #08182a;
    --cyan: #43edf8;
    --cyan-bright: #00e7ff;
    --cyan-dim: #16749b;
    --border: #0a5688;
    --border-dim: #023867;
    --amber: #e08400;
    --amber-bright: #ffae00;
    --text: #dcecfa;
    --text-bright: #fffef1;
    --muted: #5a7a93;
    --danger: #ff5d73;
    --font-head: "Orbitron", sans-serif;
    --font-body: "Electrolize", sans-serif;
    --font-mono: "Share Tech Mono", monospace;
  }
  * { box-sizing: border-box; }
  @keyframes bgshift {
    0%, 100% { background-position: 50% 0%; }
    50% { background-position: 50% 14%; }
  }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, #051a2e 0%, var(--bg) 60%);
    background-size: 100% 160%;
    animation: bgshift 50s ease-in-out infinite;
    color: var(--text);
    font-family: var(--font-body);
  }
  ::selection { background: var(--cyan); color: #000; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border-dim); border-top-color: var(--cyan);
    animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;
  }

  #topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); box-shadow: 0 2px 20px rgba(0,0,0,0.4); }

  header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border-dim);
    background: linear-gradient(180deg, rgba(10, 86, 136, 0.12), transparent);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;
  }
  header .headline h1 {
    margin: 0 0 6px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-bright);
    text-shadow: 0 0 12px rgba(67, 237, 248, 0.5);
  }
  header h1 span { color: var(--cyan); }
  header p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 0.5px; }
  #status { margin-top: 10px; font-size: 11px; color: var(--cyan-dim); font-family: var(--font-mono); letter-spacing: 0.5px; }
  #fx-note { margin-top: 4px; font-size: 10px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 0.3px; max-width: 900px; }

  #prefs { display: flex; gap: 10px; flex-wrap: wrap; }
  .pref-group { display: flex; border: 1px solid var(--border-dim); }
  .pref-group button {
    background: var(--panel); border: none; border-right: 1px solid var(--border-dim); color: var(--muted);
    padding: 6px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px;
  }
  .pref-group button:last-child { border-right: none; }
  .pref-group button.active { color: var(--cyan); background: rgba(67,237,248,0.1); }
  .pref-group button:hover { color: var(--text-bright); }

  #tabs { display: flex; gap: 4px; padding: 0 28px; border-bottom: 1px solid var(--border-dim); background: var(--bg); }
  #tabs button {
    background: none; border: none; color: var(--muted); font-family: var(--font-head);
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    padding: 14px 16px 12px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  #tabs button.active { color: var(--cyan); border-bottom-color: var(--cyan); text-shadow: 0 0 8px rgba(67,237,248,0.6); }
  #tabs button:hover { color: var(--text-bright); }

  .toolbar {
    display: flex; gap: 10px; padding: 16px 28px; flex-wrap: wrap; align-items: center;
  }
  .toolbar input[type="text"] {
    background: var(--panel); border: 1px solid var(--border-dim); color: var(--text);
    padding: 8px 12px; font-family: var(--font-body); font-size: 13px; min-width: 200px;
  }
  .toolbar input[type="text"]:focus { outline: none; border-color: var(--cyan-dim); }
  .toolbar select {
    background: var(--panel); border: 1px solid var(--border-dim); color: var(--text);
    padding: 8px 10px; font-family: var(--font-body); font-size: 12px;
  }
  .pillbtn {
    background: var(--panel); border: 1px solid var(--border-dim); color: var(--muted);
    padding: 7px 16px; cursor: pointer; font-family: var(--font-body); font-size: 12px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .pillbtn.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(67,237,248,0.25) inset; }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
    padding: 4px 28px 40px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border-dim);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    animation: fadeIn 0.35s ease;
  }
  .card:hover { border-color: var(--cyan-dim); box-shadow: 0 0 18px rgba(67,237,248,0.2); transform: translateY(-2px); }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
  .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 7px; }
  .card .name { font-family: var(--font-head); font-weight: 700; font-size: 13px; letter-spacing: 0.5px; color: var(--text-bright); }
  .card .manufacturer { height: 15px; opacity: 0.65; }
  .card .manufacturer img { height: 100%; filter: grayscale(1) brightness(2.2); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; padding: 3px 8px;
    letter-spacing: 1px; text-transform: uppercase; border: 1px solid transparent;
  }
  .badge.sale { background: rgba(224,132,0,0.15); border-color: var(--amber); color: var(--amber-bright); }
  .badge.newly { background: rgba(67,237,248,0.12); border-color: var(--cyan-dim); color: var(--cyan); }
  .badge.major { background: rgba(255,93,115,0.15); border-color: var(--danger); color: var(--danger); }
  .badge.minor { background: rgba(90,122,147,0.15); border-color: var(--border-dim); color: var(--muted); }
  .price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; font-family: var(--font-mono); }
  .price { font-size: 17px; font-weight: 700; color: var(--text-bright); }
  .price.on-sale { color: var(--amber-bright); }
  .baseline { font-size: 12px; color: var(--muted); text-decoration: line-through; }
  .store-credit { font-size: 11px; color: var(--cyan-dim); font-family: var(--font-mono); }
  .usd-ref { font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
  .unavailable { font-size: 11px; color: var(--muted); font-style: italic; }
  #empty { padding: 60px 28px; color: var(--muted); text-align: center; font-family: var(--font-body); }

  #calendar, #stats-view { padding: 8px 28px 40px; display: none; }
  #calendar.visible, #stats-view.visible { display: block; }
  #grid.hidden, .toolbar.hidden, #empty.hidden-tab { display: none; }

  #cal-subtabs { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .cal-subtab {
    background: var(--panel); border: 1px solid var(--border-dim); color: var(--muted);
    padding: 7px 14px; cursor: pointer; font-family: var(--font-body); font-size: 12px;
    letter-spacing: 0.5px;
  }
  .cal-subtab.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(67,237,248,0.2) inset; }
  .cal-section { display: none; }
  .cal-section.active { display: block; }

  .cal-section h2, .stats-section h2 {
    font-family: var(--font-head); font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
    margin: 20px 0 10px; color: var(--cyan); border-bottom: 1px solid var(--border-dim); padding-bottom: 8px;
  }
  .cal-list { display: flex; flex-direction: column; gap: 8px; }
  .cal-item {
    background: var(--panel); border: 1px solid var(--border-dim);
    padding: 10px 14px; display: flex; flex-direction: column; gap: 5px;
    animation: fadeIn 0.3s ease;
  }
  .cal-item .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .cal-item .title { font-family: var(--font-head); font-weight: 700; font-size: 13px; color: var(--text-bright); }
  .cal-item .when { font-size: 11px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
  .cal-item .note { font-size: 12px; color: var(--muted); }
  .cal-item a { color: var(--cyan); text-decoration: none; font-size: 12px; }
  .cal-item a:hover { text-decoration: underline; }
  .cal-hint { font-size: 12px; color: var(--muted); margin: -4px 0 12px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border-dim); padding: 16px; animation: fadeIn 0.3s ease; }
  .stat-card .label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .stat-card .value { font-family: var(--font-mono); font-size: 22px; color: var(--cyan); font-weight: 700; }
  .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Detail-Overlay */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,4,10,0.85); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #overlay.visible { display: flex; }
  #detail-panel {
    background: var(--panel); border: 1px solid var(--cyan-dim); max-width: 640px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 0 40px rgba(67,237,248,0.15);
    animation: fadeIn 0.2s ease;
  }
  #detail-body > img { width: 100%; aspect-ratio: 21/9; object-fit: cover; display: block; }
  #detail-body-inner { padding: 20px 24px 26px; }
  .detail-specs, .detail-focus { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .detail-description { font-size: 13px; color: var(--text); line-height: 1.5; margin: 10px 0; white-space: pre-line; }
  #detail-body h2 { font-family: var(--font-head); font-size: 18px; letter-spacing: 1px; color: var(--text-bright); margin: 0 0 4px; }
  #detail-body .close { float: right; background: none; border: 1px solid var(--border-dim); color: var(--muted); cursor: pointer; padding: 4px 10px; font-size: 12px; }
  #detail-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 16px 0; }
  #detail-stats .stat-card .value { font-size: 17px; }
  #chart-wrap { margin: 16px 0; }
  #chart-wrap svg { width: 100%; height: 160px; display: block; }
  #history-list { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; max-height: 180px; overflow-y: auto; }
  #history-list .row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border-dim); font-family: var(--font-mono); }
  #history-list .row .p { color: var(--text); }
  #history-list .row .t { color: var(--muted); }
  .store-link { display: inline-block; margin-top: 14px; color: var(--cyan); font-size: 12px; text-decoration: none; letter-spacing: 1px; text-transform: uppercase; }
  .store-link:hover { text-decoration: underline; }

  /* Toast (neuer Sale erkannt) */
  #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  .toast {
    background: var(--panel); border: 1px solid var(--amber); box-shadow: 0 0 20px rgba(224,132,0,0.3);
    padding: 12px 16px; max-width: 280px; font-size: 12px; animation: toastIn 0.3s ease;
  }
  .toast .t-title { color: var(--amber-bright); font-family: var(--font-head); font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="topbar">
  <header>
    <div class="headline">
      <h1><span>&#9670;</span> Star Citizen — Store Sales</h1>
      <p id="subtitle"></p>
      <div id="status">…</div>
      <div id="fx-note">…</div>
    </div>
    <div id="prefs">
      <div class="pref-group" id="lang-switch">
        <button data-lang="de">DE</button>
        <button data-lang="en">EN</button>
      </div>
      <div class="pref-group" id="currency-switch">
        <button data-currency="usd">USD</button>
        <button data-currency="eur">EUR</button>
        <button data-currency="gbp">GBP</button>
      </div>
    </div>
  </header>
  <div id="tabs">
    <button data-tab="sales" class="active"></button>
    <button data-tab="calendar"></button>
    <button data-tab="stats"></button>
  </div>
</div>
<div class="toolbar" id="toolbar">
  <button class="pillbtn active" data-filter="sale"></button>
  <button class="pillbtn" data-filter="all"></button>
  <input type="text" id="search" />
  <select id="sort"></select>
</div>
<div id="grid"></div>
<div id="empty" hidden></div>

<div id="calendar">
  <div id="cal-subtabs">
    <button class="cal-subtab active" data-calsub="recurring"></button>
    <button class="cal-subtab" data-calsub="announcements"></button>
    <button class="cal-subtab" data-calsub="ships"></button>
  </div>
  <div class="cal-section active" data-calpanel="recurring">
    <h2 id="cal-recurring-title"></h2>
    <p class="cal-hint" id="cal-recurring-hint"></p>
    <div class="cal-list" id="cal-recurring"></div>
  </div>
  <div class="cal-section" data-calpanel="announcements">
    <h2 id="cal-announcements-title"></h2>
    <p class="cal-hint" id="cal-announcements-hint"></p>
    <div class="cal-list" id="cal-announcements"></div>
  </div>
  <div class="cal-section" data-calpanel="ships">
    <h2 id="cal-ships-title"></h2>
    <p class="cal-hint" id="cal-ships-hint"></p>
    <div class="cal-list" id="cal-ships"></div>
  </div>
</div>

<div id="stats-view">
  <div class="stats-section">
    <h2 id="stats-title"></h2>
    <div class="stat-grid" id="stat-grid"></div>
  </div>
</div>

<div id="overlay">
  <div id="detail-panel">
    <div id="detail-body"></div>
  </div>
</div>

<div id="toasts"></div>

  function loadPref(key, fallback) {
    try {
      return localStorage.getItem(key) || fallback;
    } catch {
      return fallback;
    }
  }
  function savePref(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      // localStorage blockiert (privates Fenster o.ä.) -- Auswahl gilt nur für diese Sitzung
    }
  }

  let lang = loadPref("sc-sales-lang", "de");
  let currentCurrency = loadPref("sc-sales-currency", "eur");

  function t(key, params) {
    let str = (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.de[key] || key;
    if (params) {
      for (const [k, v] of Object.entries(params)) str = str.replace(`{${k}}`, v);
    }
    return str;
  }

  // ---------------------------------------------------------------------
  // Währungen -- Roh-USD-Preise werden clientseitig umgerechnet, damit ein
  // Wechsel sofort greift statt einen neuen /api/items-Request zu brauchen.
  // ---------------------------------------------------------------------
  const CURRENCIES = {
    usd: { code: "USD", locale: "en-US", vat: 0, country: "US" },
    eur: { code: "EUR", locale: "de-DE", vat: 0.19, country: "DE" },
    gbp: { code: "GBP", locale: "en-GB", vat: 0.2, country: "UK" },
  };
  let fxRates = null; // { eur, gbp } -- USD-Basis

  function convertPrice(usd) {
    if (usd == null) return null;
    const cur = CURRENCIES[currentCurrency];
    if (cur.code === "USD") return usd;
    if (!fxRates) return null;
    const rate = cur.code === "EUR" ? fxRates.eur : fxRates.gbp;
    if (!rate) return null;
    return usd * rate * (1 + cur.vat);
  }

  function fmtPrice(usd) {
    const converted = convertPrice(usd);
    if (converted == null) return "–";
    const cur = CURRENCIES[currentCurrency];
    return converted.toLocaleString(cur.locale, { style: "currency", currency: cur.code });
  }

  function fmtUsdRaw(usd) {
    if (usd == null) return "–";
    return usd.toLocaleString("en-US", { style: "currency", currency: "USD" });
  }

  // State

  let lastScanAt = null;

  let sortMode = "name";
  let searchTerm = "";
  let activeTab = "sales";

  let knownSaleIds = new Set();

  function fmtRelative(iso) {
    if (!iso) return t("relative_never");
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return t("relative_now");
    if (mins < 60) return t("relative_min", { n: mins });
    const hours = Math.round(mins / 60);
    if (hours < 24) return t("relative_hours", { n: hours });
    return t("relative_days", { n: Math.round(hours / 24) });
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString(lang === "en" ? "en-US" : "de-DE", { day: "2-digit", month: "short", year: "numeric" });
  }

  // ---------------------------------------------------------------------
  // Status / FX
  // ---------------------------------------------------------------------
  async function pollStatus() {
    try {
      const res = await fetch("/api/status");
      const status = await res.json();
      const failedPart = status.lastScanFailed ? t("status_failed_part", { n: status.lastScanFailed }) : "";
      document.getElementById("status").textContent =
        t("status_last_scan", { rel: fmtRelative(status.lastScanAt).toUpperCase() }) +
        (status.lastScanAt ? t("status_ok_failed", { ok: status.lastScanOk, failedPart }) : "") +
        t("status_interval", { n: status.scanIntervalMinutes });

      const fxNote = document.getElementById("fx-note");
      fxRates = status.fxRates || null;
      const cur = CURRENCIES[currentCurrency];
      if (cur.code === "USD") {
        fxNote.textContent = t("fx_note_usd");
      } else if (fxRates) {
        const rate = cur.code === "EUR" ? fxRates.eur : fxRates.gbp;
        fxNote.textContent = t("fx_note", {
          vat: Math.round(cur.vat * 100),
          country: cur.country,
          rate: rate.toFixed(4),
          code: cur.code,
          rel: fmtRelative(status.fxRateUpdatedAt),
        });
      } else {
        fxNote.textContent = t("fx_loading");
      }

      if (status.lastScanAt !== lastScanAt) {
        lastScanAt = status.lastScanAt;
        loadItems();
      } else if (activeTab === "sales") {
        render(); // Preise/Relativzeiten neu rendern falls sich fx/rel geändert hat
      }
    } catch (e) {
      document.getElementById("status").textContent = t("status_unreachable");
    }
  }

  // ---------------------------------------------------------------------
  // Sales-Grid
  // ---------------------------------------------------------------------
  function applyFilters(items) {
    let result = filter === "sale" ? items.filter((i) => i.onSale || i.newlyAvailable) : items.slice();
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      result = result.filter((i) => i.name.toLowerCase().includes(q));
    }
    switch (sortMode) {
      case "price_asc":
        result.sort((a, b) => (a.price ?? Infinity) - (b.price ?? Infinity));
        break;
      case "price_desc":
        result.sort((a, b) => (b.price ?? -1) - (a.price ?? -1));
        break;
      case "discount":
        result.sort((a, b) => (b.discountPct || 0) - (a.discountPct || 0));
        break;
      default:
        result.sort((a, b) => a.name.localeCompare(b.name));
    }
    return result;
  }

  function render() {
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const visible = applyFilters(allItems);

    if (visible.length === 0) {
      grid.innerHTML = "";
      empty.hidden = false;
      return;
    }
    empty.hidden = true;

    grid.innerHTML = visible
      .map((item) => {
        const badges = [];
        if (item.onSale) badges.push(`<span class="badge sale">${t("badge_sale", { pct: item.discountPct })}</span>`);
        if (item.newlyAvailable) badges.push(`<span class="badge newly">${t("badge_newly")}</span>`);
        const isWarbondSale = item.saleType === "listed_discount";
        const priceHtml = item.onSale
          ? `<span class="price on-sale">${fmtPrice(item.price)}</span><span class="baseline">${fmtPrice(item.baselinePrice)}</span>`
          : `<span class="price">${fmtPrice(item.price)}</span>`;
        const storeCreditHtml =
          item.storeCreditPriceUsd != null && item.storeCreditPriceUsd !== item.warbondPriceUsd
            ? `<div class="store-credit">${isWarbondSale ? t("store_credit_prefix") : ""}${t("store_credit", { price: fmtPrice(item.storeCreditPriceUsd) })}</div>`
            : "";
        const usdRef =
          item.price != null && CURRENCIES[currentCurrency].code !== "USD"
            ? `<div class="usd-ref">${t("rsi_display", { price: fmtUsdRaw(item.price) })}</div>`
            : "";
        const unavailable = item.availability === "OutOfStock" ? `<div class="unavailable">${t("unavailable")}</div>` : "";
        return `
          <div class="card" data-id="${item.id}">
            ${item.image ? `<img src="${item.image}" loading="lazy" alt="${item.name}" />` : ""}
            <div class="body">
              <div class="badges">${badges.join("")}</div>
              <div class="name">${item.name}</div>
              <div class="manufacturer">${item.manufacturer ? `<img src="${item.manufacturer}" alt="" />` : ""}</div>
              <div class="price-row">${priceHtml}</div>
              ${storeCreditHtml}
              ${usdRef}
              ${unavailable}
            </div>
          </div>`;
      })
      .join("");

    grid.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => openDetail(card.dataset.id));
    });
  }

  function showToast(item) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<div class="t-title">${t("toast_title")}</div><div>${t("toast_body", { name: item.name, pct: item.discountPct })}</div>`;
    document.getElementById("toasts").appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }

  function checkForNewSales(items) {
    const currentSaleIds = new Set(items.filter((i) => i.onSale).map((i) => i.id));
    if (!firstItemsLoad) {
      for (const item of items) {
        if (item.onSale && !knownSaleIds.has(item.id)) showToast(item);
      }
    }
    knownSaleIds = currentSaleIds;
    firstItemsLoad = false;
  }

  async function loadItems() {
    const res = await fetch("/api/items");
    const data = await res.json();
    checkForNewSales(data.items);
    allItems = data.items;
    render();
  }

  // ---------------------------------------------------------------------
  // Detail-Overlay mit Preis-Historie
  // ---------------------------------------------------------------------
  function buildStepChart(events, currentPriceUsd) {
    const points = events
      .filter((e) => e.price != null)
      .map((e) => ({ price: convertPrice(e.price), at: new Date(e.at).getTime() }))
      .filter((p) => p.price != null);
    if (points.length === 0) return `<p style='color:var(--muted)'>${t("detail_no_chart")}</p>`;
    const currentConverted = convertPrice(currentPriceUsd);
    if (points.length === 1) points.push({ price: currentConverted, at: Date.now() });
    else points.push({ price: points[points.length - 1].price, at: Date.now() });

    const W = 600, H = 160, PAD = 34;
    const minT = points[0].at, maxT = points[points.length - 1].at;
    const prices = points.map((p) => p.price);
    let minP = Math.min(...prices), maxP = Math.max(...prices);
    if (minP === maxP) { minP -= 1; maxP += 1; }

    const x = (tt) => PAD + ((tt - minT) / Math.max(1, maxT - minT)) * (W - PAD * 2);
    const y = (p) => H - PAD + ((maxP - p) / (maxP - minP)) * (H - PAD * 2 - 10);

    let d = `M ${x(points[0].at)} ${y(points[0].price)}`;
    for (let i = 1; i < points.length; i++) {
      d += ` L ${x(points[i].at)} ${y(points[i - 1].price)}`;
      d += ` L ${x(points[i].at)} ${y(points[i].price)}`;
    }

    const fmtConverted = (v) => new Intl.NumberFormat(CURRENCIES[currentCurrency].locale, { style: "currency", currency: CURRENCIES[currentCurrency].code }).format(v);

    return `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <line x1="${PAD}" y1="${H - PAD}" x2="${W - PAD}" y2="${H - PAD}" stroke="#0a5688" stroke-width="1" />
        <text x="${PAD}" y="14" fill="#5a7a93" font-size="10" font-family="Share Tech Mono">${fmtConverted(maxP)}</text>
        <text x="${PAD}" y="${H - PAD + 16}" fill="#5a7a93" font-size="10" font-family="Share Tech Mono">${fmtConverted(minP)}</text>
        <path d="${d}" fill="none" stroke="#43edf8" stroke-width="2" style="filter: drop-shadow(0 0 4px rgba(67,237,248,0.6))" />
      </svg>`;
  }

  async function openDetail(itemId) {
    const overlay = document.getElementById("overlay");
    const body = document.getElementById("detail-body");
    overlay.classList.add("visible");
    body.innerHTML = `<span class="spinner"></span>${t("loading")}`;

    const item = allItems.find((i) => i.id === itemId);
    const res = await fetch(`/api/items/${itemId}/history`);
    const data = await res.json();
    const stats = data.stats;

    const statCards = stats
      ? `
        <div class="stat-card"><div class="label">${t("detail_current_price")}</div><div class="value">${fmtPrice(stats.currentPrice)}</div></div>
        <div class="stat-card"><div class="label">${t("detail_all_time_low")}</div><div class="value">${fmtPrice(stats.allTimeLow)}</div></div>
        <div class="stat-card"><div class="label">${t("detail_all_time_high")}</div><div class="value">${fmtPrice(stats.allTimeHigh)}</div></div>
        <div class="stat-card"><div class="label">${t("detail_price_changes")}</div><div class="value">${stats.priceChangeCount}</div></div>
        ${item && item.storeCreditPriceUsd != null ? `<div class="stat-card"><div class="label">${t("detail_store_credit")}</div><div class="value">${fmtPrice(item.storeCreditPriceUsd)}</div></div>` : ""}
      `
      : "";

    const historyRows = data.events
      .slice()
      .reverse()
      .map(
        (e) =>
          `<div class="row"><span class="p">${fmtPrice(e.price)}${e.availability === "OutOfStock" ? t("detail_not_purchasable") : ""}</span><span class="t">${fmtDate(e.at)}</span></div>`
      )
      .join("");

    const di = data.item;
    const specsParts = [];
    if (di.crew) specsParts.push(`${t("detail_specs_crew")}: ${di.crew}`);
    if (di.length_m) specsParts.push(`${t("detail_specs_length")}: ${di.length_m} m`);
    if (di.mass_kg) specsParts.push(`${t("detail_specs_mass")}: ${Number(di.mass_kg).toLocaleString(lang === "en" ? "en-US" : "de-DE")} kg`);
    const specsLine = specsParts.length ? `<div class="detail-specs">${specsParts.join(" · ")}</div>` : "";
    const focusLine = di.focus ? `<div class="detail-focus">${di.focus}${di.manufacturer_name ? " · " + di.manufacturer_name : ""}</div>` : "";
    const descriptionHtml = di.description ? `<p class="detail-description">${di.description}</p>` : "";

    body.innerHTML = `
      ${di.image ? `<img src="${di.image}" alt="${di.name}" />` : ""}
      <div id="detail-body-inner">
      <button class="close" id="detail-close">${t("detail_close")}</button>
      <h2>${di.name}</h2>
      ${focusLine}
      ${specsLine}
      ${descriptionHtml}
      <div style="color:var(--muted); font-size:12px; margin-top:10px;">${stats ? t("detail_tracked_since", { date: fmtDate(stats.trackedSince) }) : t("detail_no_history")}</div>
      ${stats ? `<div id="detail-stats">${statCards}</div>` : ""}
      <div id="chart-wrap">${stats ? buildStepChart(data.events, stats.currentPrice) : ""}</div>
      <div id="history-list">${historyRows}</div>
      <a class="store-link" href="${di.url}" target="_blank" rel="noopener">${t("detail_open_store")}</a>
      </div>
    `;
    document.getElementById("detail-close").addEventListener("click", () => overlay.classList.remove("visible"));
  }

  // ---------------------------------------------------------------------
  // Kalender
  // ---------------------------------------------------------------------
  const MONTH_NAMES = {
    de: ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"],
    en: ["January","February","March","April","May","June","July","August","September","October","November","December"],
  };

  function nextOccurrence(month, day) {
    const now = new Date();
    const d = day || 1;
    let year = now.getFullYear();
    let candidate = new Date(year, month - 1, d);
    if (candidate < now) candidate = new Date(year + 1, month - 1, d);
    return candidate;
  }

  let lastCalendarData = null;

  function renderRecurringEvents(events) {
    const months = MONTH_NAMES[lang] || MONTH_NAMES.de;
    const withDates = events
      .map((e) => ({ ...e, nextDate: nextOccurrence(e.month, e.day) }))
      .sort((a, b) => a.nextDate - b.nextDate);

    document.getElementById("cal-recurring").innerHTML = withDates
      .map((e) => {
        const whenText = e.day ? `${e.day}. ${months[e.month - 1]}` : `${months[e.month - 1]} ${t("cal_expected")}`;
        const daysUntil = Math.round((e.nextDate - new Date()) / 86400000);
        const badge = e.majorSale ? `<span class="badge major">${t("cal_major_sale")}</span>` : `<span class="badge minor">${t("cal_minor_sale")}</span>`;
        const note = lang === "en" && e.noteEn ? e.noteEn : e.note;
        return `
          <div class="cal-item">
            <div class="top-row">
              <span class="title">${e.name}</span>
              <span class="when">${whenText} · ${t("cal_days_until", { n: daysUntil })}</span>
            </div>
            <div>${badge}</div>
            <div class="note">${note}</div>
          </div>`;
      })
      .join("");
  }

  function renderAnnouncements(announcements) {
    const el = document.getElementById("cal-announcements");
    if (announcements.length === 0) {
      el.innerHTML = `<p class="cal-hint">${t("cal_announcements_empty")}</p>`;
      return;
    }
    el.innerHTML = announcements
      .map((a) => {
        const isEvent = a.matchedKeywords && a.matchedKeywords.length > 0;
        const badge = isEvent ? `<span class="badge major">${a.matchedKeywords[0]}</span>` : "";
        return `
          <div class="cal-item">
            <div class="top-row">
              <span class="title">${a.title}</span>
              <span class="when">${fmtRelative(a.first_seen_at)}</span>
            </div>
            ${badge ? `<div>${badge}</div>` : ""}
            <a href="${a.url}" target="_blank" rel="noopener">${t("cal_article_link")}</a>
          </div>`;
      })
      .join("");
  }

  function renderShipsInDevelopment(ships) {
    const el = document.getElementById("cal-ships");
    if (ships.length === 0) {
      el.innerHTML = `<p class="cal-hint">${t("cal_ships_empty")}</p>`;
      return;
    }
    el.innerHTML = ships
      .map(
        (s) => `
          <div class="cal-item">

              <span class="title">${s.name}</span>
              <span class="when">${s.status === "in-concept" ? t("cal_in_concept") : s.status}</span>

            ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${t("cal_more_info")}</a>` : ""}
          </div>`
      )
      .join("");
  }

  function renderStats() {

      <div class="stat-card"><div class="label">${t("stat_on_sale")}</div><div class="value">${s.onSaleCount}</div></div>
      <div class="stat-card"><div class="label">${t("stat_fleet_value")}</div><div class="value">${fmtPrice(s.totalCatalogValue)}</div><div class="sub">${t("stat_fleet_value_sub")}</div></div>
      <div class="stat-card"><div class="label">${t("stat_avg_price")}</div><div class="value">${fmtPrice(s.avgPrice)}</div></div>
      <div class="stat-card"><div class="label">${t("stat_cheapest")}</div><div class="value">${fmtPrice(s.cheapest.price)}</div><div class="sub">${s.cheapest.name}</div></div>
      <div class="stat-card"><div class="label">${t("stat_priciest")}</div><div class="value">${fmtPrice(s.priciest.price)}</div><div class="sub">${s.priciest.name}</div></div>
      ${s.biggestDiscount ? `<div class="stat-card"><div class="label">${t("stat_biggest_discount")}</div><div class="value">-${s.biggestDiscount.discountPct}%</div><div class="sub">${s.biggestDiscount.name}</div></div>` : ""}
      <div class="stat-card"><div class="label">${t("stat_price_changes")}</div><div class="value">${s.totalPriceChangesTracked}</div></div>
      <div class="stat-card"><div class="label">${t("stat_announcements")}</div><div class="value">${s.totalAnnouncementsTracked}</div></div>
      <div class="stat-card"><div class="label">${t("stat_tax_label")}</div><div class="sub">${t("stat_tax_sub")}</div></div>
    `;
  }

  async function loadStats() {
    const res = await fetch("/api/stats");
    lastStats = await res.json();
    renderStats();
  }

  // ---------------------------------------------------------------------
  // Tabs / Filter / Sortierung
  // ---------------------------------------------------------------------
  document.getElementById("toolbar").addEventListener("click", (e) => {
    const btn = e.target.closest(".pillbtn");
    if (!btn) return;
    filter = btn.dataset.filter;
    document.querySelectorAll(".pillbtn").forEach((b) => b.classList.toggle("active", b === btn));
    render();
  });
  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value;
    render();
  });
  document.getElementById("sort").addEventListener("change", (e) => {
    sortMode = e.target.value;
    render();
  });

  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    activeTab = btn.dataset.tab;
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b === btn));

    document.getElementById("calendar").classList.toggle("visible", activeTab === "calendar");
    document.getElementById("stats-view").classList.toggle("visible", activeTab === "stats");
    document.getElementById("toolbar").classList.toggle("hidden", activeTab !== "sales");
    document.getElementById("grid").classList.toggle("hidden", activeTab !== "sales");

    if (activeTab === "calendar") loadCalendar();
    if (activeTab === "stats") loadStats();
  });

  // ---------------------------------------------------------------------
  // Sprache / Währung
  // ---------------------------------------------------------------------
  document.getElementById("lang-switch").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (!btn) return;
    lang = btn.dataset.lang;
    savePref("sc-sales-lang", lang);
    applyStaticText();
    render();
    if (lastCalendarData) {
      renderRecurringEvents(lastCalendarData.recurringEvents);
      renderAnnouncements(lastCalendarData.announcements);
      renderShipsInDevelopment(lastCalendarData.shipsInDevelopment);
    }
    if (lastStats) renderStats();
  });

  document.getElementById("currency-switch").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-currency]");
    if (!btn) return;
    currentCurrency = btn.dataset.currency;
    savePref("sc-sales-currency", currentCurrency);
    applyStaticText();
    render();
    if (lastStats) renderStats();
    pollStatus();
  });

  // ---------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------
  applyStaticText();
  pollStatus();
  loadItems();
  setInterval(pollStatus, 60000);
</script>
</body>
</html>
