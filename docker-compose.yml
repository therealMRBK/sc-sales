services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-180}
      SCAN_REQUEST_DELAY_MS: ${SCAN_REQUEST_DELAY_MS:-400}
    volumes:
      - sc_sales_data:/data
    ports:
      - "${HOST_PORT:-3400}:3000"

volumes:
  sc_sales_data:
